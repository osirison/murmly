<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" fill="none" role="img" aria-labelledby="local-title">
  <title id="local-title">Your microphone, the speech model and the window you are typing in all sit inside your machine. Nothing crosses out of it. One arrow crosses in, once: the first run downloads the model.</title>

  <!-- the machine -->
  <rect x="28" y="64" width="584" height="208" rx="18" stroke="currentColor" stroke-width="2.5"
        stroke-dasharray="1 0" opacity="0.45" fill="currentColor" fill-opacity="0.03"/>
  <text x="52" y="94" fill="currentColor" font-family="system-ui, sans-serif" font-size="14"
        opacity="0.62" letter-spacing="0.08em">YOUR MACHINE</text>

  <g stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- microphone -->
    <g transform="translate(74,140)">
      <rect x="0" y="0" width="120" height="88" rx="12" stroke-width="2" opacity="0.4"/>
      <rect x="50" y="18" width="20" height="30" rx="10" stroke-width="2.5"/>
      <path d="M44 42 a16 16 0 0 0 32 0" stroke-width="2.5"/>
      <path d="M60 58 v10" stroke-width="2.5"/>
    </g>

    <!-- the model -->
    <g transform="translate(260,140)">
      <rect x="0" y="0" width="120" height="88" rx="12" stroke-width="2" opacity="0.4"/>
      <rect x="34" y="22" width="52" height="44" rx="8" stroke-width="2.5"/>
      <path d="M46 36 h28 M46 46 h28 M46 56 h16" stroke-width="2.5" opacity="0.75"/>
    </g>

    <!-- the window you were typing in -->
    <g transform="translate(446,140)">
      <rect x="0" y="0" width="120" height="88" rx="12" stroke-width="2" opacity="0.4"/>
      <rect x="28" y="20" width="64" height="48" rx="7" stroke-width="2.5"/>
      <path d="M28 32 h64" stroke-width="2.5"/>
      <path d="M38 46 h34 M38 56 h20" stroke-width="4" opacity="0.8"/>
    </g>

    <!-- inside, everything flows left to right -->
    <path d="M202 184 h46" stroke-width="2.5" opacity="0.6"/>
    <path d="M240 176 l8 8 -8 8" stroke-width="2.5" opacity="0.6"/>
    <path d="M388 184 h46" stroke-width="2.5" opacity="0.6"/>
    <path d="M426 176 l8 8 -8 8" stroke-width="2.5" opacity="0.6"/>

    <!-- the one thing that crosses the boundary, and it only happens once -->
    <path d="M320 30 v76" stroke-width="2.5" stroke-dasharray="7 7" opacity="0.75"/>
    <path d="M312 98 l8 10 8 -10" stroke-width="2.5" opacity="0.75"/>
  </g>

  <g fill="currentColor" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="134" y="252" font-size="14" opacity="0.9">Microphone</text>
    <text x="320" y="252" font-size="14" opacity="0.9">Speech model</text>
    <text x="506" y="252" font-size="14" opacity="0.9">Your window</text>
    <text x="320" y="22" font-size="13" opacity="0.72">first run only: the model is downloaded</text>
  </g>
</svg>
