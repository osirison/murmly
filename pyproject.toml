[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murmly"
version = "0.1.0"
description = "Fedora-first local voice-to-text daemon for Linux desktops"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "osirison" }]
dependencies = [
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12,<13",
    "nvidia-cudnn-cu12>=9,<10",
    # The ONNX synthesis provider links four libraries CTranslate2 does not, and
    # reports a missing one as a warning before running on the CPU.
    "nvidia-cuda-runtime-cu12>=12,<13",
    "nvidia-cufft-cu12>=11,<12",
    "nvidia-curand-cu12>=10,<11",
    "nvidia-nvjitlink-cu12>=12,<13",
]

# Speech output on the CPU. Also needs espeak-ng from the distribution, and the
# model files in $XDG_DATA_HOME/murmly; `murmly doctor` names whichever is
# missing.
#
# Installed by default, as a group rather than an extra, because `uv sync`
# matches the extras it is given exactly: an install that named only
# `--extra cuda` removed the synthesizer, and a daemon already running kept
# accepting speech sessions it could no longer serve. A default group is
# included unless it is excluded by name, so nothing drops it by omission.
# Leaving it out is `--no-group tts`.
#
# onnxruntime-gpu is deliberately not listed. It installs into the same
# `onnxruntime` package namespace as the CPU build that faster-whisper and
# kokoro-onnx both depend on, so listing it here would resolve both
# distributions into one environment and leave the survivor of any later
# uninstall broken. Running synthesis on the GPU is a swap, not an addition:
#
#     uv pip uninstall onnxruntime
#     uv pip install --reinstall "onnxruntime-gpu==1.24.4"
#
# `--reinstall` is not optional when the GPU build is already present: the
# uninstall deletes files both distributions own, and a plain install sees its
# own metadata intact and restores nothing. Every `uv run`/`uv sync` reintroduces
# the CPU build and puts you in exactly that state, because it arrives as a
# dependency of faster-whisper, which nothing here is optional about.
#
# The version is pinned by docs/agent-notes/onnxruntime-gpu-cuda-version.md:
# 1.25+ moved to CUDA 13, whose wheels are not on PyPI yet, while the `cuda`
# extra above pins the CUDA 12 line for CTranslate2.
[dependency-groups]
tts = [
    "kokoro-onnx>=0.6.1",
]

[tool.uv]
# What makes speech output survive a sync that does not mention it. See the
# comment on the group itself for why it is not an extra.
default-groups = ["tts"]

[project.scripts]
murmly = "murmly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
