[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murmly"
version = "0.1.0"
description = "Fedora-first local voice-to-text daemon for Linux desktops"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "osirison" }]
dependencies = [
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.5",
    # The command channel's named-pipe transport (section 7): CPython exposes no
    # `AF_UNIX` on Windows, and `win32pipe`/`win32security` are what build a pipe
    # whose DACL grants only the creating user's SID. Markered so no other
    # platform resolves or installs it.
    "pywin32==312 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
# All six `nvidia-*-cu12` packages publish `win_amd64` wheels -- confirmed
# per-package in task 11's report -- so CUDA transcription and synthesis are
# available on Windows too, through `stt.py`'s own `os.add_dll_directory`
# mechanism rather than the `RTLD_GLOBAL` one these wheels' Linux builds use.
# None of the six publishes any macOS wheel, of either architecture, so
# resolving this extra on macOS fails outright with a build error naming a
# package rather than the situation -- `sys_platform != 'darwin'` on every
# requirement is what keeps that resolution failure from happening at all.
# Task 15's own macOS spike, not this one, is what decides whether macOS
# needs an entry here of its own (`design.md`: CTranslate2 has no GPU backend
# on macOS regardless).
cuda = [
    "nvidia-cublas-cu12>=12,<13 ; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform != 'darwin'",
    # The ONNX synthesis provider links four libraries CTranslate2 does not, and
    # reports a missing one as a warning before running on the CPU.
    "nvidia-cuda-runtime-cu12>=12,<13 ; sys_platform != 'darwin'",
    "nvidia-cufft-cu12>=11,<12 ; sys_platform != 'darwin'",
    "nvidia-curand-cu12>=10,<11 ; sys_platform != 'darwin'",
    "nvidia-nvjitlink-cu12>=12,<13 ; sys_platform != 'darwin'",
]

# The Windows overlay renderer's toolkit (task 10.2). An extra, not a default
# dependency the way `pywin32` is: the overlay already degrades to
# `NullOverlayController` when its backend has no usable mechanism -- the
# same thing that happens today on every non-Plasma Linux desktop -- so
# nothing about starting Murmly or serving a command needs it. PySide6 is a
# large wheel; marking it `sys_platform == 'win32'` on a *default*
# dependency, the way `pywin32` is marked, would still put it in every
# Windows install and CI run whether or not the overlay is wanted, and macOS
# is not marked in at all -- its own overlay (section 15) is an open spike,
# not a shipped renderer, so nothing here should resolve for it yet. Installed
# with `uv sync --extra overlay` on Windows.
overlay = [
    "PySide6>=6.7,<7 ; sys_platform == 'win32'",
]

# Speech output on the CPU. Also needs espeak-ng from the distribution, and the
# model files in $XDG_DATA_HOME/murmly; `murmly doctor` names whichever is
# missing.
#
# Installed by default, as a group rather than an extra, because `uv sync`
# matches the extras it is given exactly: an install that named only
# `--extra cuda` removed the synthesizer, and a daemon already running kept
# accepting speech sessions it could no longer serve. A default group is
# included unless it is excluded by name, so nothing drops it by omission.
# Leaving it out is `--no-group tts`.
#
# onnxruntime-gpu is deliberately not listed. It installs into the same
# `onnxruntime` package namespace as the CPU build that faster-whisper and
# kokoro-onnx both depend on, so listing it here would resolve both
# distributions into one environment and leave the survivor of any later
# uninstall broken. Running synthesis on the GPU is a swap, not an addition:
#
#     uv pip uninstall onnxruntime
#     uv pip install --reinstall "onnxruntime-gpu==1.24.4"
#
# `--reinstall` is not optional when the GPU build is already present: the
# uninstall deletes files both distributions own, and a plain install sees its
# own metadata intact and restores nothing. Every `uv run`/`uv sync` reintroduces
# the CPU build and puts you in exactly that state, because it arrives as a
# dependency of faster-whisper, which nothing here is optional about.
#
# The version is pinned by docs/agent-notes/onnxruntime-gpu-cuda-version.md:
# 1.25+ moved to CUDA 13, whose wheels are not on PyPI yet, while the `cuda`
# extra above pins the CUDA 12 line for CTranslate2.
[dependency-groups]
tts = [
    "kokoro-onnx>=0.6.1",
]

# The documentation site generator. Deliberately not a default group: a
# developer's plain `uv sync` and the CI test matrix must be unchanged by it,
# so it is installed only by `uv sync --only-group docs`, which is what the
# Pages workflow runs. Every package it pulls in is a pure-Python wheel.
#
# mkdocs is pinned below 2 on purpose. Material prints a warning on every build
# that MkDocs 2.0 removes the plugin system, rewrites theming, offers no
# migration path, and is currently unlicensed. Until that settles, crossing
# that major version should be a deliberate uv.lock diff rather than a
# resolver's choice.
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7,<10",
]

[tool.uv]
# What makes speech output survive a sync that does not mention it. See the
# comment on the group itself for why it is not an extra.
default-groups = ["tts"]

[project.scripts]
murmly = "murmly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
